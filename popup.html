<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TikTok Auto Upload</title>
    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            padding: 12px;
            background: #121212;
            color: #ffffff;
            margin: 0;
        }
        h3 {
            font-size: 14px;
            margin-top: 0;
            color: #fe2c55;
            margin-bottom: 10px;
        }
        .box {
            margin-bottom: 10px;
            background: #1e1e24;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #2a2a30;
        }
        label {
            font-size: 11px;
            color: #a0a0ab;
            display: block;
            margin-bottom: 4px;
        }
        input[type="file"], select, input[type="number"] {
            width: 100%;
            font-size: 11px;
            color: #fff;
            background: #121212;
            border: 1px solid #333;
            padding: 5px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #fe2c55;
            color: white;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover { background-color: #e02447; }
        #status {
            font-size: 11px;
            margin-top: 8px;
            color: #00ffcc;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h3>TikTok Auto Upload</h3>

    <div class="box">
        <label>1. Chọn file JSON:</label>
        <input type="file" id="jsonFile" accept=".json">
    </div>

    <div class="box">
        <label>2. Video có trạng thái "Đã duyệt":</label>
        <select id="videoSelect">
            <option value="">-- Vui lòng chọn file JSON trước --</option>
        </select>
    </div>

    <div class="box">
        <label>3. Chọn các file video tương ứng từ máy:</label>
        <input type="file" id="videoFile" accept="video/mp4,video/webm,video/ogg" multiple>
    </div>

    <div class="box">
        <label>4. Thời gian chờ giữa các video (phút):</label>
        <input type="number" id="delayMinutes" value="5" min="0" step="0.5">
    </div>

    <button id="uploadBtn">Tải lên TikTok Studio</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
